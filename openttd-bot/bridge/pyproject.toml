[project]
name = "ottd-chatbot"
version = "0.1.0"
description = "Natural-language construction bot for OpenTTD multiplayer servers (admin-port bridge + Claude)"
requires-python = ">=3.11"
dependencies = ["anthropic>=0.70"]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
ottd-chatbot = "ottd_bot.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["ottd_bot"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
